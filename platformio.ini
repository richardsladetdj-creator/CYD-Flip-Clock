; CYD (ESP32-2432S028, two-USB / ST7789 variant) flip clock
;
; OTA password comes from the FLIPCLOCK_OTA_PASS environment variable (never committed).
;   export FLIPCLOCK_OTA_PASS='something-long'
;   pio run -e usb -t upload     # first flash over USB
;   pio run -e ota -t upload     # afterwards, over WiFi

[env:usb]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    tzapu/WiFiManager@2.0.17
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -DOTA_PASS=\"${sysenv.FLIPCLOCK_OTA_PASS}\"
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1         ; micro-USB-only boards: use -DILI9341_2_DRIVER=1 instead
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_RGB_ORDER=TFT_BGR   ; tuning knob: TFT_RGB if colours look swapped
    -DTFT_INVERSION_OFF=1     ; tuning knob: -DTFT_INVERSION_ON=1 if cards show white/negative
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

[env:ota]
extends = env:usb
upload_protocol = espota
upload_port = flipclock.local
upload_flags = --auth=${sysenv.FLIPCLOCK_OTA_PASS}
